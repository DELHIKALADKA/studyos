# ============================================================
# StudyOS — GitHub Pages deployment
#
# Publishes the static app in StudyOS/ to
#   https://DELHIKALADKA.github.io/studyos/
#
# Setup (one time, done by the repo owner):
#   Settings → Pages → Source: "GitHub Actions"
#   (Private repos need GitHub Pro, or make the repo public.)
#
# After that, every push to `main` redeploys automatically,
# and the workflow can also be run manually from the Actions tab.
# ============================================================
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time — cancel older runs on new pushes.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: StudyOS

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
